# GNOME extension CI on the forge (git.burmese-shiner.ts.net, nika). The macOS and Windows jobs
# stay on GitHub Actions (.github/workflows/darwin-*, windows-*) until the forge has runners for
# them; every Linux job runs here.
name: gnome CI

on:
  push:
    branches: [main]
    paths:
      - "gnome/**"
      - ".forgejo/workflows/gnome-ci.yml"
  pull_request:
    paths:
      - "gnome/**"
      - ".forgejo/workflows/gnome-ci.yml"
  workflow_dispatch:

concurrency:
  group: gnome-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: gnome

jobs:
  build:
    # Host job: the runner's container mode cannot run JS actions under podman yet. Tools from
    # nixpkgs (node 24, glib-compile-schemas, zip, gh).
    runs-on: nix
    env:
      tools: nix shell nixpkgs#nodejs_24 nixpkgs#glib.bin nixpkgs#zip nixpkgs#unzip nixpkgs#gh -c
    steps:
      - uses: actions/checkout@v4
      - run: $tools npm ci
      - run: $tools npm run lint
      - run: $tools bin/zentab-package
      - name: Verify extension archive layout
        run: $tools unzip -l 'dist-packages/zentab@zentab.app.shell-extension.zip'
