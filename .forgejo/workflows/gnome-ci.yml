# GNOME extension CI on the forge (git.burmese-shiner.ts.net, nika). The macOS and Windows jobs
# stay on GitHub Actions (.github/workflows/darwin-*, windows-*) until the forge has runners for
# them; every Linux job runs here.
name: gnome CI

on:
  push:
    branches: [main]
    paths:
      - "gnome/**"
      - ".forgejo/workflows/gnome-ci.yml"
  pull_request:
    paths:
      - "gnome/**"
      - ".forgejo/workflows/gnome-ci.yml"
  workflow_dispatch:

concurrency:
  group: gnome-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: gnome

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gnome/package-lock.json
      - name: Install system packaging tools
        run: apt-get update && apt-get install -y libglib2.0-bin zip
      - run: npm ci
      - run: npm run lint
      - run: bin/zentab-package
      - name: Verify extension archive layout
        run: unzip -l 'dist-packages/zentab@zentab.app.shell-extension.zip'
      - uses: actions/upload-artifact@v3
        with:
          name: zentab-gnome-${{ github.sha }}
          path: gnome/dist-packages/zentab@zentab.app.shell-extension.zip
          if-no-files-found: error
