# GNOME extension release, built on the forge (nika). The download page stays the GitHub Release
# (the public repo is where users look): the job waits for the mirror to carry the tag to GitHub,
# then creates the release there with GHCR_TOKEN (a yasinuslu PAT with repo scope).
#
# Bump gnome/package.json + metadata.json, then push a matching namespaced tag:
#   git tag gnome-v0.1.0 && git push origin gnome-v0.1.0
name: gnome Release

on:
  push:
    tags: ["gnome-v*"]

defaults:
  run:
    working-directory: gnome

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gnome/package-lock.json
      - name: Install system packaging tools
        run: apt-get update && apt-get install -y libglib2.0-bin zip
      - run: npm ci
      - name: Resolve version
        run: echo "version=${GITHUB_REF_NAME#gnome-v}" >> "$GITHUB_ENV"
      - run: npm run lint
      - name: Build installable extension ZIP
        run: bin/zentab-package "$version"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          set -euo pipefail
          for _ in $(seq 60); do
            gh api "repos/yasinuslu/zentab/git/ref/tags/$GITHUB_REF_NAME" >/dev/null 2>&1 && break
            sleep 5
          done
          cat > "$RUNNER_TEMP/notes.md" <<'NOTES'
          ### Install (GNOME Shell 48–50)

          1. Download `zentab@zentab.app.shell-extension.zip` from this release.
          2. Install it:
             ```bash
             gnome-extensions install --force zentab@zentab.app.shell-extension.zip
             ```
          3. Log out and back in (required on Wayland after first install).
          4. Enable it:
             ```bash
             gnome-extensions enable zentab@zentab.app
             ```

          ZenTab is not yet published on extensions.gnome.org. This ZIP is the standard
          GNOME Shell extension archive and can also be inspected with `unzip -l`.
          NOTES
          sed -i 's/^          //' "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" -R yasinuslu/zentab \
            --title "ZenTab for GNOME $version" --generate-notes --notes-file "$RUNNER_TEMP/notes.md" \
            dist-packages/zentab@zentab.app.shell-extension.zip
